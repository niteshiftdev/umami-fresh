---
# Sandbox overlay for the repository's docker-compose.yml, applied on top of it:
#   docker compose -f docker-compose.yml -f .niteshift/docker-compose.yml up db
#
# Only the `db` service is used here — the web app runs from source via the
# `web` service in services.yaml, not from the published umami image.
services:
  db:
    # The dev server runs on the host, not in a container, so it needs to reach
    # the database at localhost:5432. Host networking rather than a published
    # port because it needs no NAT support from the sandbox runtime; publishing
    # `ports: ["5432:5432"]` on the default bridge also works here and is the
    # swap to make if this ever has to coexist with the compose `umami` service.
    network_mode: host
    container_name: umami-postgres
    # Postgres reads SIGTERM as a *smart* shutdown and then waits for the web
    # app's open connections. SIGINT is the fast shutdown: disconnect clients
    # and exit. Compose sends this when the supervisor stops it.
    stop_signal: SIGINT
    stop_grace_period: 20s
    # The ns supervisor owns restarts; a Docker restart policy would fight it.
    restart: "no"
volumes:
  # Keep the plain volume name rather than the compose-project-prefixed one, so
  # the data survives moving between `docker run` and compose.
  umami-db-data:
    name: umami-db-data
