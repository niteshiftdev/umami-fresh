services:
  # Keep the database in the foreground so Niteshift owns its lifecycle. The
  # named volume preserves data when the container is replaced or restarted.
  - name: postgres
    command: docker stop --time 30 umami-postgres >/dev/null 2>&1 || true; docker rm umami-postgres >/dev/null 2>&1 || true; exec docker run --rm --name umami-postgres --network=host -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD -v umami-db-data:/var/lib/postgresql/data postgres:15-alpine
    stopGracePeriod: 30s
    environment:
      - name: POSTGRES_DB
        value: umami
      - name: POSTGRES_USER
        value: umami
      - name: POSTGRES_PASSWORD
        value: umami
  - name: web
    command: pnpm run dev
    port: 3000
  # Generates the traffic that "happened" since the last tick, so today, the last
  # 24 hours, and realtime stay current while the sandbox is up — and a long
  # suspend is filled in on the first tick after it comes back.
  #
  # Run directly rather than through `pnpm run`: the pnpm and tsx launchers put the
  # script in a process the supervisor's stop signal does not reach, which leaves an
  # orphaned seeder behind on every restart.
  - name: seed-live
    command: node --import tsx scripts/seed-data.ts --live
