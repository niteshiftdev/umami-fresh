services:
  # PostgreSQL runs as a supervised service so the supervisor owns its lifecycle
  # (restart on crash, stop on shutdown) instead of a detached `docker run -d`
  # from setup. This reuses the `db` service the repository's docker-compose.yml
  # already defines; .niteshift/docker-compose.yml overlays the sandbox-specific
  # bits (host networking, fast shutdown, no Docker restart policy).
  #
  # Compose runs in the foreground so the supervisor can signal it, and stops the
  # container gracefully on SIGTERM — hence no `-d` and no shutdown wrapper here.
  #
  # autostart is off because setup skips the local database entirely when an
  # external DATABASE_URL is provided; setup runs `ns services start postgres`
  # when it actually needs it.
  - name: postgres
    command: docker compose -f docker-compose.yml -f .niteshift/docker-compose.yml up db
    autostart: false
    stopGracePeriod: 30s
  - name: web
    command: pnpm run dev
    port: 3000
  # Generates the traffic that "happened" since the last tick, so today, the last
  # 24 hours, and realtime stay current while the sandbox is up — and a long
  # suspend is filled in on the first tick after it comes back.
  #
  # Run directly rather than through `pnpm run`: the pnpm and tsx launchers put the
  # script in a process the supervisor's stop signal does not reach, which leaves an
  # orphaned seeder behind on every restart.
  - name: seed-live
    command: node --import tsx scripts/seed-data.ts --live
